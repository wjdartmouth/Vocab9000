name: Vocab9000
options:
  bundleIdPrefix: com.jianwang
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "5.9"
  TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Vocab9000:
    type: application
    platform: iOS
    sources:
      - path: Vocab9000
        excludes:
          - "**/.DS_Store"
          - "**/Resources/**"
    resources:
      - path: Vocab9000/Resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.jianwang.Vocab9000
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: Vocab9000
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      CURRENT_PROJECT_VERSION: "1"
      MARKETING_VERSION: "1.0"
