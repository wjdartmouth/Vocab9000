name: Vocab9000
options:
  bundleIdPrefix: com.jianwang
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "5.9"
  TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Vocab9000:
    type: application
    platform: iOS
    sources:
      - path: Vocab9000
        excludes:
          - "**/.DS_Store"
          - "**/Resources/**"
          - "**/PrivacyInfo.xcprivacy"
      - path: Shared
    resources:
      - path: Vocab9000/Resources
      - path: Vocab9000/PrivacyInfo.xcprivacy
    entitlements:
      path: Vocab9000/Vocab9000.entitlements
    info:
      path: Vocab9000/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.jianwang.Vocab9000
            CFBundleURLSchemes:
              - vocab9000
        ITSAppUsesNonExemptEncryption: false
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.jianwang.Vocab9000
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: Vocab9000
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      INFOPLIST_KEY_NSUserNotificationsUsageDescription: 学習リマインダーのために通知を送ります。
      INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
      CURRENT_PROJECT_VERSION: "1"
      MARKETING_VERSION: "1.0"
      CODE_SIGN_ENTITLEMENTS: Vocab9000/Vocab9000.entitlements
    dependencies:
      - target: Vocab9000WidgetExtension
        embed: true

  Vocab9000WidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Vocab9000Widget
        excludes:
          - "**/PrivacyInfo.xcprivacy"
      - path: Shared
    resources:
      - path: Vocab9000Widget/PrivacyInfo.xcprivacy
      - path: Vocab9000Widget/Localizable.xcstrings
    entitlements:
      path: Vocab9000Widget/Vocab9000Widget.entitlements
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.jianwang.Vocab9000.Widget
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: Vocab9000
      INFOPLIST_KEY_NSHumanReadableCopyright: ""
      CURRENT_PROJECT_VERSION: "1"
      MARKETING_VERSION: "1.0"
      CODE_SIGN_ENTITLEMENTS: Vocab9000Widget/Vocab9000Widget.entitlements
      LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    info:
      path: Vocab9000Widget/Info.plist
      properties:
        CFBundleDisplayName: Vocab9000
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
